set timeout=10
set default=0

insmod all_video
insmod gfxterm
insmod font

if loadfont ${prefix}/fonts/unicode.pf2; then
    set gfxmode=1024x768
    set gfxpayload=keep
    terminal_output gfxterm
fi

menuentry "Synth3x OS — Synth3x DE" {
    linux /boot/vmlinuz quiet loglevel=3 video=vesafb:1024x768-32 vga=0x367
    initrd /boot/initrd.img
}

menuentry "Synth3x OS — Verbose" {
    linux /boot/vmlinuz video=vesafb:1024x768-32 vga=0x367
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
