set timeout=5
set default=0

insmod all_video

menuentry "Synth3x OS" {
    linux /boot/vmlinuz-linux loglevel=6 console=tty0 video=vesafb:1024x768-16 vga=0x117
    initrd /boot/initrd.img
}

menuentry "Synth3x OS — 32bpp" {
    linux /boot/vmlinuz-linux loglevel=6 console=tty0 video=vesafb:1024x768-32
    initrd /boot/initrd.img
}

menuentry "Synth3x OS — Text" {
    linux /boot/vmlinuz-linux loglevel=6 console=tty0
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
