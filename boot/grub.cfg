set timeout=5
set default=0
set gfxmode=1024x768
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod font

if loadfont ${prefix}/fonts/unicode.pf2; then
    terminal_output gfxterm
fi

menuentry "Synth3x OS" {
    linux /boot/vmlinuz-linux quiet loglevel=3 vga=0x367 video=vesafb:1024x768-32
    initrd /boot/initrd.img
}

menuentry "Synth3x OS — Verbose" {
    linux /boot/vmlinuz-linux vga=0x367 video=vesafb:1024x768-32
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
