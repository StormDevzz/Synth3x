set timeout=8
set default=0

insmod all_video
insmod part_gpt
insmod fat
insmod ext2
insmod serial

# Serial console for -nographic / headless
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_output gfxterm serial
terminal_input gfxterm serial

# Cyberpunk GRUB theme colors
set menu_color_normal=cyan/black
set menu_color_highlight=magenta/black

menuentry "★ Synth3x-Anon v0.8 (Gentoo Live — Amnesic RAM) ★" {
    linux /boot/vmlinuz-linux loglevel=3 console=tty0 console=ttyS0,115200 quiet
    initrd /boot/initrd.img
}

menuentry "--> INSTALL to Hard Disk (Press ESC, run: synth3x-installer)" {
    linux /boot/vmlinuz-linux loglevel=3 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "--> Synth3x-Anon (Debug Mode — verbose boot)" {
    linux /boot/vmlinuz-linux loglevel=7 console=tty0 console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "--> Boot from Hard Disk (if installed)" {
    insmod part_gpt
    insmod ext2
    search --no-floppy --label --set=root SYNTH3X_ROOT
    linux /vmlinuz-linux loglevel=3 root=/dev/sda2 ro console=tty0 console=ttyS0,115200
    initrd /initrd.img
}

menuentry "Reboot" { reboot }
menuentry "Shutdown" { halt }
