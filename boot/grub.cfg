set timeout=8
set default=0

insmod all_video

menuentry "★ Synth3x-Anon Live (Enforced Tor Routing & Amnesic RAM) ★" {
    linux /boot/vmlinuz-linux loglevel=6 console=tty0
    initrd /boot/initrd.img
}

menuentry "--> INSTALL Gentoo Guided (Press ESC in GUI, then run: 'synth3x-installer')" {
    linux /boot/vmlinuz-linux loglevel=6 console=tty0
    initrd /boot/initrd.img
}

menuentry "Reboot Host" {
    reboot
}

menuentry "Shutdown Host" {
    halt
}
