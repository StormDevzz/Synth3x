<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffc8"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8c00ff"/>
      <stop offset="100%" stop-color="#ff00c8"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff4444"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- gear hint: Rust systems programming (bottom-right) -->
  <g transform="translate(180,190) scale(0.55)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#rust)" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="url(#rust)"/>
    <line x1="0" y1="-32" x2="0" y2="-38" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="0" y2="38" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="-38" y2="0" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="38" y2="0" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-22" y1="-22" x2="-27" y2="-27" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="27" y2="-27" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="-22" y1="22" x2="-27" y2="27" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="27" y2="27" stroke="url(#rust)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- C curly brace hint (bottom-left) -->
  <g transform="translate(70,195)">
    <path d="M-15,-25 C-5,-25 5,-20 5,-10 C5,-2 0,5 -5,10" stroke="#00ffc8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-15,25 C-5,25 5,20 5,10 C5,2 0,-5 -5,-10" stroke="#00ffc8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- big A with < > brackets integrated (cyber/AI style) -->
  <g transform="translate(88,36)">
    <!-- A left leg with < bracket shape -->
    <path d="M0,130 L0,10 L40,10 L70,70 L40,10" stroke="url(#cyan)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A right leg with > bracket hint -->
    <path d="M82,10 L114,10 L114,130" stroke="url(#cyan)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A crossbar (floating, code-like) -->
    <line x1="8" y1="70" x2="108" y2="70" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- semicolon dot on crossbar -->
    <circle cx="108" cy="70" r="4" fill="url(#cyan)"/>

    <!-- I / pipe -->
    <rect x="140" y="10" width="14" height="120" rx="4" fill="url(#purple)"/>
    <!-- semicolons on I -->
    <circle cx="147" cy="60" r="5" fill="#1a0a2e" stroke="url(#purple)" stroke-width="2"/>
    <circle cx="147" cy="85" r="5" fill="#1a0a2e" stroke="url(#purple)" stroke-width="2"/>
  </g>

  <!-- < / > angle brackets flanking the A (code references) -->
  <g transform="translate(128,128)">
    <path d="M-122,-50 L-114,-30 L-122,-10" stroke="url(#purple)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M122,-50 L114,-30 L122,-10" stroke="url(#cyan)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- small // comment markers top-right -->
  <g transform="translate(170,32)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#00ffc8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="5" y1="10" x2="25" y2="10" stroke="#00ffc8" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- semicolon ; bottom-center -->
  <g transform="translate(128,218)">
    <circle cx="0" cy="0" r="3" fill="url(#purple)"/>
    <line x1="0" y1="3" x2="0" y2="15" stroke="url(#purple)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
