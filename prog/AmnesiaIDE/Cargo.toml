[package]
name = "amnesia-ide"
version = "0.2.0"
edition = "2021"
description = "AmnesiaIDE — Lightweight GUI IDE for C, C++, C#, Rust, and Assembly"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_extras = { version = "0.27", features = ["image", "svg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"

[profile.release]
opt-level = 2
lto = true
