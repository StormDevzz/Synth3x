name: Build & Release

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip xorriso zstd xz-utils busybox-static mtools

      - name: Build ISO
        run: bash scripts/build_anon_iso.sh

      - name: Verify ISO exists
        id: verify_iso
        run: |
          if [ -f iso/synth3x-anon.iso ] && [ -s iso/synth3x-anon.iso ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ISO size: $(du -h iso/synth3x-anon.iso | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ISO file not found or empty!"
          fi

      - name: Store ISO as artifact
        if: steps.verify_iso.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synth3x-anon-v${{ steps.version.outputs.version }}
          path: iso/synth3x-anon.iso

      - name: Check tag existence
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body
        run: |
          F=/tmp/release_body.md
          echo "## How to use" > $F
          echo "" >> $F
          echo "### Write to USB flash drive" >> $F
          echo "Find your USB device (usually /dev/sdX or /dev/nvme0n1):" >> $F
          echo '```' >> $F
          echo "  lsblk" >> $F
          echo '```' >> $F
          echo "Write the ISO (replace /dev/sdX with your device):" >> $F
          echo '```' >> $F
          echo "  sudo dd if=synth3x-anon.iso of=/dev/sdX bs=4M status=progress" >> $F
          echo "  sudo sync" >> $F
          echo '```' >> $F
          echo "> **WARNING:** This will erase ALL data on /dev/sdX!" >> $F
          echo "" >> $F
          echo "### Boot in QEMU" >> $F
          echo '```' >> $F
          echo "  qemu-system-x86_64 -cdrom synth3x-anon.iso -m 1024 -accel kvm -vga std -device usb-tablet -display gtk" >> $F
          echo '```' >> $F
          echo "" >> $F
          echo "### Boot from USB" >> $F
          echo "1. Restart your computer" >> $F
          echo "2. Press F12/F2/Del/Esc during boot (varies by manufacturer)" >> $F
          echo "3. Select your USB drive from the boot menu" >> $F
          echo "4. Synth3x-Anon loads into AmnesiaDE desktop" >> $F
          echo "" >> $F
          echo "### Default credentials (live session)" >> $F
          echo "- User: root (no password)" >> $F
          echo "- Desktop: AmnesiaDE v${{ steps.version.outputs.version }}" >> $F
          echo "" >> $F
          echo "### Features" >> $F
          echo "- AmnesiaDE graphical framebuffer desktop" >> $F
          echo "- Web browser (w3m -- type 'browser' in terminal, switch with Alt+F1/F7)" >> $F
          echo "- syn package manager (inst/binary/list/search/remove/update)" >> $F
          echo "- Hardware detection (Lenovo, Acer, Dell, HP + generic)" >> $F
          echo "- Internet setup guide (Ethernet, USB tethering, static IP)" >> $F
          echo "- Hard disk installer (synth3x-installer)" >> $F
          echo "- Tor launcher (tor-start -- saves ~30MB RAM when idle)" >> $F
          echo "- Driver checks (check-drivers-all)" >> $F
          echo "- Built-in firewall (nftables)" >> $F

      - name: Create Release
        if: steps.verify_iso.outputs.exists == 'true' && steps.check_tag.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          echo "Creating release v${V}..."
          gh release create "v${V}" \
            --title "Synth3x-Anon v${V}" \
            --notes-file /tmp/release_body.md \
            --generate-notes \
            --latest \
            iso/synth3x-anon.iso
          echo "✓ Release v${V} created with ISO attached"

      - name: Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.check_tag.outputs.exists }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            if [ "$TAG_EXISTS" = "false" ]; then
              TAG="[RELEASE]"
              ACTION="New release: Synth3x-Anon v${VERSION}"
            else
              TAG="[BUILD]"
              ACTION="Build OK: Synth3x-Anon v${VERSION} (no version change)"
            fi
          else
            TAG="[FAIL]"
            ACTION="Build failed: Synth3x-Anon v${VERSION}"
          fi

          if [ "$STATUS" = "success" ]; then COLOR=5763719; else COLOR=15548997; fi

          COMMIT_MSG="${{ github.event.head_commit.message || 'push' }}"
          COMMIT_MSG_ESCAPED=$(printf '%s' "$COMMIT_MSG" | head -5 | jq -Rs .)

          curl -s -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TAG} Synth3x-Anon v${VERSION}\",
                \"description\": ${COMMIT_MSG_ESCAPED},
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"$ACTION\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[${GITHUB_SHA::7}](${COMMIT_URL})\", \"inline\": true}
                ],
                \"url\": \"${RUN_URL}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" || echo "Webhook send failed (non-critical)"
