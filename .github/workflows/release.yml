name: Build & Release

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip xorriso zstd xz-utils busybox-static mtools libdrm-dev

      - name: Build ISO
        run: bash scripts/build_iso.sh

      - name: Verify ISO exists
        id: verify_iso
        run: |
          if [ -f iso/synth3x.iso ] && [ -s iso/synth3x.iso ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ISO size: $(du -h iso/synth3x.iso | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ISO file not found or empty!"
          fi

      - name: Store ISO as artifact
        if: steps.verify_iso.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synth3x-v${{ steps.version.outputs.version }}
          path: iso/synth3x.iso

      - name: Build release body
        run: cp docs/release_notes.md /tmp/release_body.md

      - name: Create or Update Release
        if: steps.verify_iso.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading ISO..."
            gh release upload "$TAG" iso/synth3x.iso --clobber 2>&1 || true
            gh release edit "$TAG" --latest --notes-file /tmp/release_body.md 2>&1 || true
            echo "✓ ISO uploaded to existing release ${TAG}"
          else
            echo "Creating release ${TAG}..."
            gh release create "$TAG" \
              --title "Synth3x" \
              --notes-file /tmp/release_body.md \
              --generate-notes \
              --latest \
              iso/synth3x.iso
            echo "✓ Release ${TAG} created with ISO attached"
          fi

      - name: Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          AUTHOR_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          AUTHOR_USERNAME="${{ github.event.head_commit.author.username || github.actor }}"
          AUTHOR_AVATAR="https://github.com/${AUTHOR_USERNAME}.png?size=64"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            TAG="BUILD OK"
            COLOR=5763719
          else
            TAG="BUILD FAIL"
            COLOR=15548997
          fi

          if [ -n "$VERSION" ]; then
            TITLE="${TAG}: Synth3x v${VERSION}"
          else
            TITLE="${TAG}: Synth3x"
          fi

          COMMIT_MSG=$(printf '%s' "${{ github.event.head_commit.message || 'push' }}" | head -8 | jq -Rs .)

          # List changed files (top 5 most important)
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | head -8)
          FILE_LIST=""
          COUNT=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            FILE_LIST+="\`$f\`\n"
            COUNT=$((COUNT + 1))
          done <<< "$CHANGED"
          if [ "$COUNT" -gt 8 ]; then
            FILE_LIST+="… +$((COUNT - 8)) more"
          fi
          [ -z "$FILE_LIST" ] && FILE_LIST="*no file changes*"

          PAYLOAD=$(cat << ENDJSON
          {
            "embeds": [{
              "author": {
                "name": "${AUTHOR_NAME}",
                "icon_url": "${AUTHOR_AVATAR}",
                "url": "https://github.com/${AUTHOR_USERNAME}"
              },
              "title": "${EMOJI} ${TITLE}",
              "description": ${COMMIT_MSG},
              "color": ${COLOR},
              "fields": [
                {"name": "Build", "value": "${EMOJI} ${STATUS}", "inline": true},
                {"name": "Commit", "value": "[${GITHUB_SHA::7}](${COMMIT_URL})", "inline": true},
                {"name": "Key files", "value": "${FILE_LIST}", "inline": false}
              ],
              "footer": {
                "text": "Synth3x CI · ${TAG}",
                "icon_url": "https://github.githubassets.com/favicons/favicon-dark.png"
              },
              "url": "${RUN_URL}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          ENDJSON
          )

          curl -s -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "$PAYLOAD" || echo "Webhook send failed (non-critical)"
