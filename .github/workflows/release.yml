name: Build & Release

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip xorriso zstd xz-utils busybox-static mtools libdrm-dev

      - name: Build ISO
        run: bash scripts/build_iso.sh

      - name: Verify ISO exists
        id: verify_iso
        run: |
          if [ -f iso/synth3x-anon.iso ] && [ -s iso/synth3x-anon.iso ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ISO size: $(du -h iso/synth3x-anon.iso | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ISO file not found or empty!"
          fi

      - name: Store ISO as artifact
        if: steps.verify_iso.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synth3x-anon-v${{ steps.version.outputs.version }}
          path: iso/synth3x-anon.iso

      - name: Build release body
        run: cp docs/release_notes.md /tmp/release_body.md

      - name: Create or Update Release
        if: steps.verify_iso.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading ISO..."
            gh release upload "$TAG" iso/synth3x-anon.iso --clobber 2>&1 || true
            gh release edit "$TAG" --latest --notes-file /tmp/release_body.md 2>&1 || true
            echo "✓ ISO uploaded to existing release ${TAG}"
          else
            echo "Creating release ${TAG}..."
            gh release create "$TAG" \
              --title "Synth3x-Anon v${V}" \
              --notes-file /tmp/release_body.md \
              --generate-notes \
              --latest \
              iso/synth3x-anon.iso
            echo "✓ Release ${TAG} created with ISO attached"
          fi

      - name: Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            TAG="[BUILD]"
            ACTION="Build OK: Synth3x-Anon v${VERSION}"
          else
            TAG="[FAIL]"
            ACTION="Build failed: Synth3x-Anon v${VERSION}"
          fi

          if [ "$STATUS" = "success" ]; then COLOR=5763719; else COLOR=15548997; fi

          COMMIT_MSG="${{ github.event.head_commit.message || 'push' }}"
          COMMIT_MSG_ESCAPED=$(printf '%s' "$COMMIT_MSG" | head -5 | jq -Rs .)

          curl -s -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TAG} Synth3x-Anon v${VERSION}\",
                \"description\": ${COMMIT_MSG_ESCAPED},
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"$ACTION\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[${GITHUB_SHA::7}](${COMMIT_URL})\", \"inline\": true}
                ],
                \"url\": \"${RUN_URL}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" || echo "Webhook send failed (non-critical)"
