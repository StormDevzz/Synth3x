name: Build & Release

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip xorriso zstd xz-utils busybox-static mtools libdrm-dev

      - name: Build ISO
        run: bash scripts/build_iso.sh

      - name: Verify ISO exists
        id: verify_iso
        run: |
          if [ -f iso/synth3x.iso ] && [ -s iso/synth3x.iso ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ISO size: $(du -h iso/synth3x.iso | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ISO file not found or empty!"
          fi

      - name: Store ISO as artifact
        if: steps.verify_iso.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synth3x-v${{ steps.version.outputs.version }}
          path: iso/synth3x.iso

      - name: Build release body
        run: cp README.md /tmp/release_body.md

      - name: Create or Update Release
        if: steps.verify_iso.outputs.exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — uploading ISO..."
            gh release upload "$TAG" iso/synth3x.iso --clobber 2>&1 || true
            gh release edit "$TAG" --latest --notes-file /tmp/release_body.md 2>&1 || true
            echo "✓ ISO uploaded to existing release ${TAG}"
          else
            echo "Creating release ${TAG}..."
            gh release create "$TAG" \
              --title "Synth3x" \
              --notes-file /tmp/release_body.md \
              --generate-notes \
              --latest \
              iso/synth3x.iso
            echo "✓ Release ${TAG} created with ISO attached"
          fi

      - name: Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          REPO="${{ github.repository }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHA7="${GITHUB_SHA::7}"
          AUTHOR_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          AUTHOR_USERNAME="${{ github.event.head_commit.author.username || github.actor }}"
          AUTHOR_AVATAR="https://github.com/${AUTHOR_USERNAME}.png?size=64"

          if [ "$STATUS" = "success" ]; then
            TAG="Passed"
            COLOR=5763719
          else
            TAG="Failed"
            COLOR=15548997
          fi

          TITLE="Build ${TAG}: ${REPO}"
          if [ -n "$VERSION" ]; then
            TITLE="${TITLE} v${VERSION}"
          fi

          COMMIT_MSG=$(printf '%s' "${{ github.event.head_commit.message || 'push' }}" | head -4 | jq -Rs .)

          # Build changed files list
          BEFORE="${{ github.event.before }}"
          CHANGED=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(git log -1 --name-only --format="" 2>/dev/null | head -6 || true)
          fi

          FILE_LINES=""
          FCOUNT=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            FILE_LINES+="\`$f\`\n"
            FCOUNT=$((FCOUNT + 1))
          done <<< "$(echo "$CHANGED" | head -6)"
          TC=$FCOUNT
          if [ "$FCOUNT" -gt 6 ]; then
            FILE_LINES+="\`… +$((FCOUNT - 6)) more\`"
          fi

          FILES_VALUE="${FILE_LINES:-*none*}"
          CHANGE_LABEL="Changed"
          [ "$TC" -eq 1 ] && CHANGE_LABEL="Changed 1 file" || CHANGE_LABEL="Changed ${TC} files"

          PAYLOAD=$(cat << ENDJSON
          {
            "embeds": [{
              "author": {
                "name": "${AUTHOR_NAME}",
                "icon_url": "${AUTHOR_AVATAR}",
                "url": "https://github.com/${AUTHOR_USERNAME}"
              },
              "title": "${TITLE}",
              "description": ${COMMIT_MSG},
              "color": ${COLOR},
              "image": {"url": "https://i.imgur.com/aw5D7My.png"},
              "fields": [
                {"name": "Status", "value": "${TAG}", "inline": true},
                {"name": "Branch", "value": "${BRANCH}", "inline": true},
                {"name": "Commit", "value": "[${SHA7}](${COMMIT_URL})", "inline": true},
                {"name": "${CHANGE_LABEL}", "value": "${FILES_VALUE}", "inline": false}
              ],
              "footer": {
                "text": "${REPO} · ${BRANCH} · ${SHA7}",
                "icon_url": "https://github.githubassets.com/favicons/favicon-dark.png"
              },
              "url": "${COMMIT_URL}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            }]
          }
          ENDJSON
          )

          curl -s -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "$PAYLOAD" || echo "Webhook send failed (non-critical)"
