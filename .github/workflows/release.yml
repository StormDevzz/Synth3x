name: Build & Release

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip xorriso zstd xz-utils busybox-static

      - name: Build ISO
        run: bash scripts/build_anon_iso.sh

      - name: Verify ISO exists
        id: verify_iso
        run: |
          if [ -f iso/synth3x-anon.iso ] && [ -s iso/synth3x-anon.iso ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ISO size: $(du -h iso/synth3x-anon.iso | cut -f1)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ISO file not found or empty!"
          fi

      - name: Store ISO as artifact
        if: steps.verify_iso.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synth3x-anon-v${{ steps.version.outputs.version }}
          path: iso/synth3x-anon.iso

      - name: Check tag existence
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release body
        run: |
          cat << BODY > /tmp/release_body.md
  ## How to use

  ### Write to USB flash drive
  Find your USB device (usually \`/dev/sdX\` or \`/dev/nvme0n1\`):
  \`\`\`
  lsblk
  \`\`\`
  Write the ISO (replace \`/dev/sdX\` with your device):
  \`\`\`
  sudo dd if=synth3x-anon.iso of=/dev/sdX bs=4M status=progress
  sudo sync
  \`\`\`
  > **WARNING:** This will erase ALL data on \`/dev/sdX\`!

  ### Boot in QEMU
  \`\`\`
  qemu-system-x86_64 -cdrom synth3x-anon.iso -m 1024 -accel kvm -vga std -device usb-tablet -display gtk
  \`\`\`

  ### Boot from USB
  1. Restart your computer
  2. Press F12 / F2 / Del / Esc during boot (varies by manufacturer)
  3. Select your USB drive from the boot menu
  4. Synth3x-Anon will load into the AmnesiaDE desktop

  ### Default credentials (live session)
  - User: \`root\` (no password)
  - Desktop: AmnesiaDE v${{ steps.version.outputs.version }}

  ### Features
  - AmnesiaDE graphical framebuffer desktop
  - Web browser (w3m — type \`browser\` in terminal, switch with Alt+F1/F7)
  - \`syn\` package manager (inst/binary/list/search/remove/update)
  - Hardware detection (Lenovo, Acer, Dell, HP + generic)
  - Internet setup guide (Ethernet, USB tethering, static IP)
  - Hard disk installer (\`synth3x-installer\`)
  - Tor launcher (\`tor-start\` — saves ~30MB RAM when idle)
  - Driver checks (\`check-drivers-all\`)
  - Built-in firewall (nftables)
  BODY

      - name: Create Release
        if: steps.verify_iso.outputs.exists == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Synth3x-Anon v${{ steps.version.outputs.version }}
          body_path: /tmp/release_body.md
          files: iso/synth3x-anon.iso
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Discord notification
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.check_tag.outputs.exists }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set, skipping notification"
            exit 0
          fi

          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            if [ "$TAG_EXISTS" = "false" ]; then
              TAG="[RELEASE]"
              ACTION="New release: Synth3x-Anon v${VERSION}"
            else
              TAG="[BUILD]"
              ACTION="Build OK: Synth3x-Anon v${VERSION} (no version change)"
            fi
          else
            TAG="[FAIL]"
            ACTION="Build failed: Synth3x-Anon v${VERSION}"
          fi

          if [ "$STATUS" = "success" ]; then COLOR=5763719; else COLOR=15548997; fi

          COMMIT_MSG="${{ github.event.head_commit.message || 'push' }}"
          COMMIT_MSG_ESCAPED=$(printf '%s' "$COMMIT_MSG" | head -5 | jq -Rs .)

          curl -s -H "Content-Type: application/json" \
            -X POST "$DISCORD_WEBHOOK" \
            -d "{
              \"embeds\": [{
                \"title\": \"${TAG} Synth3x-Anon v${VERSION}\",
                \"description\": ${COMMIT_MSG_ESCAPED},
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"$ACTION\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"[${GITHUB_SHA::7}](${COMMIT_URL})\", \"inline\": true}
                ],
                \"url\": \"${RUN_URL}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }" || echo "Webhook send failed (non-critical)"
