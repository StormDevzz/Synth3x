set timeout=10
set default=0

insmod all_video
insmod gfxterm

if loadfont ${prefix}/fonts/unicode.pf2; then
    set gfxmode=1024x768
    set gfxpayload=keep
    terminal_output gfxterm
fi

menuentry "Synth3x OS" {
    linux /boot/vmlinuz-linux quiet loglevel=3 video=vesafb:1024x768-32
    initrd /boot/initrd.img
}

menuentry "Synth3x OS — Verbose" {
    linux /boot/vmlinuz-linux video=vesafb:1024x768-32
    initrd /boot/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
